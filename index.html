<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#05060a" />

    <title>Zyraa HRMS — Attendance, Payroll and People in One System</title>

      content="Zyraa is an HRMS for manufacturing units: biometric attendance, staff and production payroll, leave and permission approvals, geo on-duty and 140+ reports. Built in Tiruppur."

    <!-- Open Graph / Twitter. Social scrapers do not run JS, so these static

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zyraa HRMS" />
    <meta property="og:title" content="Zyraa HRMS — Attendance, Payroll and People in One System" />
    <meta
      property="og:description"
      content="Biometric attendance, staff and production payroll, approvals and reporting for manufacturing units. One system, three ways in."
    />
    <meta property="og:url" content="https://zyraa.app/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://zyraa.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zyraa HRMS — the single system that runs the people side of your company" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zyraa HRMS — Attendance, Payroll and People in One System" />
    <meta
      name="twitter:description"
      content="Biometric attendance, staff and production payroll, approvals and reporting for manufacturing units."
    />
    <meta name="twitter:image" content="https://zyraa.app/og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "@id": "https://zyraa.app/#software",
        "name": "Zyraa HRMS",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Human Resource Management System",
        "operatingSystem": "Web, Android, iOS",
        "url": "https://zyraa.app/",
        "image": "https://zyraa.app/og-image.png",
        "description": "HRMS for manufacturing units: biometric attendance, staff and production payroll, leave and permission approvals, geo on-duty tracking and reporting.",

        "author": {
          "@type": "Person",
          "name": "Surya",
          "jobTitle": "Developer"
        },
        "offers": {
          "@type": "Offer",
          "availability": "https://schema.org/InStock",
          "priceCurrency": "INR",
          "description": "Pricing on request. Contact for a demo."

        "areaServed": { "@type": "Country", "name": "India" },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-93448-59103",
          "contactType": "sales",
          "areaServed": "IN",
          "availableLanguage": ["en", "ta"]
        }
